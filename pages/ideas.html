<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Detail Idea Konsep Desain</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../assets/Logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header class="app-bar">
    <div class="app-bar-inner">
        <a class="brand" href="../index.html">
            <img src="../assets/Logo.png" alt="">
            <span>Konsep Desain Interior</span>
        </a>
        <ol class="stepper" aria-label="Tahapan">
            <li class="is-done"><span class="step-index">1</span>Penilaian</li>
            <li class="is-active" aria-current="step"><span class="step-index">2</span>Ide<span class="step-text-long">&amp; Ruangan</span></li>
            <li><span class="step-index">3</span>Hasil</li>
        </ol>
    </div>
</header>
    <div class="container">
        <div class="ideas-top-section">
            <span class="eyebrow">Tahap 2 · Ide &amp; Ruangan</span>
            <h1>Rincian Idea Konsep Desain</h1>
            <div id="identitasDisplay" class="identity-chip">
                <span>Nama: <strong id="displayNama">-</strong></span>
                <span>Judul tugas: <strong id="displayJudul">-</strong></span>
            </div>
            <span id="categoryLabel" class="category-tag">Kategori: Kinerja Internal</span>
        </div>

        <!-- ARAH KONSEP IMAGE -->
        <div id="conceptDirectionContainer"></div>

        <!-- WORKFLOW PROGRESS BAR -->
        <div id="workflowProgress" class="workflow-progress"></div>

        <!-- WORKFLOW STEPS (ide + ruangan sejajar) -->
        <div id="workflowSteps" class="workflow-steps">
            <!-- Dynamically populated -->
        </div>

        <!-- FINISH BANNER -->
        <div id="finishBanner" class="finish-banner" style="display: none;">
            <div class="finish-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
            <h2>Semua Ide Selesai Diisi!</h2>
            <p>Anda telah melengkapi seluruh ide untuk kategori ini. Silakan lihat hasil.</p>
        </div>

        <div class="ideas-footer">
            <button onclick="goToDashboard()" class="btn gray-bg"><svg class="icon-btn" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Kembali ke Dashboard</button>
            <button onclick="goToResultPage()" class="btn result-page-btn"><svg class="icon-btn" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg> Lihat Hasil</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="../js/custom-alert.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/db.js"></script>
    <script src="../js/ideas.js"></script>
</body>
</html>
